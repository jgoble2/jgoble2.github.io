<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Floating Color Palettes</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        
        <div class="color-palette">
            <h2>Ocean Breeze</h2>
            <h4 class="color" id="color-1">#0077B6</h4>
            <h4 class="color" id="color-2">#00B4D8</h4>
            <h4 class="color" id="color-3">#90E0EF</h4>
        </div>

        <div class="color-palette">
            <h2>Sunset Glow</h2>
            <h4 class="color" id="color-4">#FF6B35</h4>
            <h4 class="color" id="color-5">#F7A072</h4>
            <h4 class="color" id="color-6">#F25F5C</h4>
        </div>

        <div class="color-palette">
            <h2>Forest Earth</h2>
            <h4 class="color" id="color-7">#386641</h4>
            <h4 class="color" id="color-8">#6A994E</h4>
            <h4 class="color" id="color-9">#A7C957</h4>
        </div>

    </body>
</html>
